services:
  - type: web
    name: devsync-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Pins the deployment runtime to Node 24, matching the Node target both packages
      # declare in their engines field.
      - key: NODE_VERSION
        value: "24"

      # The exact Vercel production origin. It is the only origin CORS and Socket.IO
      # accept. Render prompts for it when the blueprint is first created; give it a
      # temporary value and replace it with the real origin once the frontend is up.
      - key: FRONTEND_URL
        sync: false

      # Judge0 credential. Server-side only, set in the dashboard, never committed.
      - key: JUDGE0_API_KEY
        sync: false

      - key: JUDGE0_API_HOST
        value: judge0-ce.p.rapidapi.com
      - key: JUDGE0_API_URL
        value: https://judge0-ce.p.rapidapi.com

# PORT is supplied by Render and read straight from the environment.
# DevSync keeps room state in process memory, so this stays a single instance.
