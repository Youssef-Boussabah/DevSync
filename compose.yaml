# Docker Compose for DevSync.
#
#   docker compose up -d --build
#
# Four services, three of them built from the repository root because this is a
# pnpm workspace. There is no `version:` key: it has been obsolete since the
# Compose Specification, and Compose warns about it.
#
# `docker compose down` keeps your projects. Only `down --volumes` deletes the
# `postgres_data` volume, and with it every project and file in it.
#
# **Open DevSync at http://127.0.0.1:3000**, not at `localhost:3000`. The API
# allows exactly one browser origin and those two are different origins.
#
# The three published host ports are variables with the defaults they have always
# had, so `docker compose up` on its own behaves exactly as before. They exist
# because C4's restart validation brings a second, disposable copy of this stack
# up in its own Compose project (`devsync-c4-validation`) while a developer's own
# stack may be running, and two stacks cannot publish the same port. The
# container-side ports never move, and neither does the URL Compose passes
# between services. See docs/testing.md.

name: devsync

services:
  database:
    # Pinned to a patch release, the way the Node base image is. PostgreSQL 18
    # moved the data directory: the volume below mounts `/var/lib/postgresql`,
    # not the `/var/lib/postgresql/data` path that was correct up to 17.
    image: postgres:18.3-alpine3.23
    init: true
    ports:
      # Published so host-run development and `pnpm test:db` can reach the same
      # server Compose runs.
      #
      # 5433 on the host, not 5432. A developer with PostgreSQL already installed
      # is listening on 5432, and the collision is silent in the worst way: the
      # connection succeeds against the wrong server and then fails to
      # authenticate, or worse, does not. Inside the Compose network the port is
      # the ordinary 5432, so only host-side URLs carry the offset.
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    environment:
      # Development credentials, stated explicitly. They are not secrets, and
      # nothing outside a developer's machine ever authenticates with them.
      POSTGRES_USER: devsync
      POSTGRES_PASSWORD: devsync
      POSTGRES_DB: devsync
    volumes:
      - postgres_data:/var/lib/postgresql
      # Runs once, when the volume is empty, to add the disposable test database.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Proves the server accepts connections for the database the API will use,
      # which is what the migration step and the API then wait on.
      test: ['CMD-SHELL', 'pg_isready --username=devsync --dbname=devsync --quiet']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    # One-shot. It applies the committed migrations and exits; the API waits for
    # that exit rather than migrating itself, so two API instances starting at
    # once cannot race each other through the schema.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    init: true
    environment:
      DATABASE_URL: postgresql://devsync:devsync@database:5432/devsync
    depends_on:
      database:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Runs the container's process under an init that forwards SIGTERM and reaps
    # children. Without it the server is PID 1, where the kernel drops signals
    # that have no explicit handler, and `docker compose down` waits the full
    # grace period before killing it.
    init: true
    ports:
      - '${API_HOST_PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      # Passed explicitly. DevSync loads `.env` only outside containers, so a
      # value that is not stated here is not configured at all.
      API_PORT: '3001'
      DATABASE_URL: postgresql://devsync:devsync@database:5432/devsync
      # The one origin the API answers cross-origin browser requests for, and the
      # address to open DevSync at. It is matched exactly: to a browser
      # `http://localhost:3000` is a different origin from the one below, and a
      # page loaded at that address gets no allow-origin header back.
      #
      # It follows the published web port rather than restating 3000, so a stack
      # brought up on another port still allows the address it is actually served
      # from.
      WEB_ORIGIN: http://127.0.0.1:${WEB_HOST_PORT:-3000}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Proves the HTTP application actually answers, not merely that a process
      # is alive. Uses Node's built-in fetch, so the image needs no curl or wget.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # A build argument, not an environment variable: `next build` embeds this
        # into the JavaScript it emits, so it is fixed when the image is built and
        # changing it means rebuilding.
        #
        # The **host-published** address, because the code that uses it runs in the
        # user's browser. `http://api:3001` would resolve inside the Compose
        # network and nowhere else, and every request would fail with a name the
        # browser cannot look up.
        #
        # It follows the published API port for the same reason `WEB_ORIGIN`
        # follows the published web port: the two halves of one boundary must
        # agree, and restating a number in two places is how they stop agreeing.
        NEXT_PUBLIC_API_URL: http://127.0.0.1:${API_HOST_PORT:-3001}
    init: true
    ports:
      - '${WEB_HOST_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      # Read by the Next.js standalone server. HOSTNAME is what makes it listen on
      # every interface inside the container rather than on loopback only.
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    depends_on:
      # C3's edge, and the first runtime dependency `web` has ever had on `api`.
      # The browser — not this container — is what calls the API, so this does not
      # make the page fail without it; what it does is stop Compose reporting the
      # stack as up while the only thing the page can do is show an error.
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  # Named, so `docker compose down` leaves the data behind and only
  # `down --volumes` destroys it.
  postgres_data:
